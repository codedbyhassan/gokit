name: Bug report
description: Report a reproducible problem in GoKit
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve GoKit. Please search existing issues before opening a duplicate.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and the behavior you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest code or input that reproduces the problem.
      render: go
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: GoKit version or commit
    validations:
      required: true
  - type: input
    id: go-version
    attributes:
      label: Go version
      placeholder: "go version"
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, browser (if relevant), and any deployment details.
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      render: text
